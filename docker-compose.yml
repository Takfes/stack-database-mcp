services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./init/pg-seed.sql:/docker-entrypoint-initdb.d/pg-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - ./init/mysql-seed.sql:/docker-entrypoint-initdb.d/mysql-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -padmin"]
      interval: 5s
      timeout: 5s
      retries: 10
